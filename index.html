<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업비트 반전 스크리너 (일봉)</title>
<style>
  :root{
    --bg:#0e1117; --panel:#161b22; --panel2:#1c232d; --line:#2a323d;
    --text:#e6edf3; --muted:#8b949e; --accent:#3b82f6;
    --green:#16c784; --red:#ea3943; --gold:#f5b301; --purple:#a371f7;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);overflow-x:hidden;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 10px}
  .modes{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;flex-wrap:nowrap;
    scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .modes::-webkit-scrollbar{display:none}
  .mode{flex:0 0 auto;background:var(--panel2);border:1px solid var(--line);color:var(--muted);
    padding:9px 16px;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;user-select:none;white-space:nowrap}
  .mode.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;
    background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
  button.run{background:var(--accent);color:#fff;border:0;border-radius:8px;
    padding:9px 16px;font-size:14px;font-weight:600;cursor:pointer}
  button.run:disabled{opacity:.5;cursor:default}
  .status{color:var(--muted);font-size:13px}
  .filters{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:20px;
    padding:5px 12px;font-size:12px;cursor:pointer;color:var(--muted)}
  .chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .tf{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:8px;
    padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;user-select:none}
  .tf.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .summary{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:110px}
  .card .n{font-size:22px;font-weight:700}
  .card .l{font-size:12px;color:var(--muted)}
  #tableWrap{overflow-x:auto;border-radius:12px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
    border:1px solid var(--line);border-radius:12px}
  th,td{padding:10px 9px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
  th{background:var(--panel2);color:var(--muted);font-size:12px;font-weight:600;
    cursor:pointer;user-select:none;position:sticky;top:0;z-index:2}
  th:first-child,td:first-child{text-align:left;position:sticky;left:0}
  th:first-child{z-index:3}
  td:first-child{z-index:1;background:var(--panel)}
  tr:hover td{background:#1a2029}
  tr:hover td:first-child{background:#1a2029}
  td.name a{color:var(--text);text-decoration:none;font-weight:600}
  td.name a:hover{color:var(--accent)}
  .tkr{color:var(--muted);font-size:12px;margin-left:4px}
  .up{color:var(--green)} .down{color:var(--red)}
  .ratio{font-weight:700;font-size:15px}
  .r-hi{color:var(--green)} .r-mid{color:var(--gold)} .r-hi-t{color:var(--red)}
  .badges{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
  .b{font-size:10.5px;padding:2px 6px;border-radius:5px;background:var(--panel2);
    border:1px solid var(--line);color:var(--muted)}
  .b.rsi{border-color:var(--purple);color:var(--purple)}
  .b.vol{border-color:var(--green);color:var(--green)}
  .b.ma20{border-color:#6ea8fe;color:#6ea8fe}
  .b.sig{border-color:var(--gold);color:var(--gold)}
  .err{background:#3a1a1d;border:1px solid var(--red);color:#ffb3b8;
    padding:14px;border-radius:10px;margin-top:12px;display:none}
  .legend{margin-top:16px;color:var(--muted);font-size:12.5px;line-height:1.85}
  .legend b{color:var(--text)}
  .bar-prog{height:6px;background:var(--panel2);border-radius:4px;overflow:hidden;flex:1;min-width:120px;display:none}
  .bar-prog > i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  .gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
  .gate .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:32px 28px;width:320px;max-width:90vw;text-align:center}
  .gate h2{margin:0 0 6px;font-size:18px}
  .gate p{color:var(--muted);font-size:13px;margin:0 0 18px}
  .gate input{width:100%;padding:11px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel2);color:var(--text);font-size:15px;margin-bottom:10px}
  .gate button{width:100%;padding:11px;border:0;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
  .gate .msg{color:var(--red);font-size:12.5px;min-height:16px;margin-top:8px}
  .hidden{display:none!important}
  @media(max-width:760px){.hide-sm{display:none}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <div class="box">
    <h2>🔒 업비트 반전 스크리너</h2>
    <p>비밀번호를 입력하세요</p>
    <input id="pw" type="password" placeholder="비밀번호" autocomplete="off">
    <button id="gbtn">입장</button>
    <div class="msg" id="gmsg"></div>
  </div>
</div>
<div class="wrap hidden" id="app">
  <h1>업비트 반전 스크리너 <span style="font-size:13px;color:var(--muted)">(일봉)</span></h1>

  <div class="modes">
    <div class="mode on" data-m="bottom">📉→📈 바닥 반등</div>
    <div class="mode" data-m="top">📈→📉 천장 하락전환</div>
    <div class="mode" data-m="flat">📉➡️ 바닥 후 횡보</div>
    <div class="mode" data-m="vol">📊 거래량 급증</div>
  </div>

  <div class="sub" id="sub"></div>

  <div class="bar">
    <button class="run" id="run">스캔 시작</button>
    <span class="tf on" data-tf="day">일봉</span>
    <span class="tf" data-tf="4h">4시간봉</span>
    <div class="bar-prog" id="prog"><i></i></div>
    <span class="status" id="status">버튼을 눌러 스캔을 시작하세요.</span>
    <div class="filters">
      <span class="chip on" data-f="all">전체</span>
      <span class="chip" data-f="12">배율 1.2+</span>
      <span class="chip" data-f="15">배율 1.5+</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>
  <div id="tableWrap"></div>
  <div class="err" id="err"></div>
  <div class="legend" id="legend"></div>
</div>

<script>
// ▼▼▼ 본인 Cloudflare Worker 주소 (끝에 / 없이) ▼▼▼
const PROXY="https://upbit-proxy.mcraenf1.workers.dev";
const API=(PROXY||"https://api.upbit.com")+"/v1";
const CRASH_DAY=-0.15, SPIKE_DAY=0.15, MIN_MOVE_PCT=3, LOOKBACK=14, MIN_RATIO=1.0;
const FLAT_MAX_RANGE=9, FLAT_MAX_DRIFT=7, FLAT_MIN_DROP=12, FLAT_MAX_POS=0.35, FLAT_MIN_DAYS=6;

let MODE="bottom", TF="day", rows=[], sortKey="ratio", sortDir=-1, filter="all";
const $=s=>document.querySelector(s);
const statusEl=$("#status"), progWrap=$("#prog"), progBar=$("#prog > i"), errEl=$("#err");

function ema(a,p){const k=2/(p+1);let e=a[0],o=[e];for(let i=1;i<a.length;i++){e=a[i]*k+e*(1-k);o.push(e);}return o;}
function sma(a,p,i){if(i+1<p)return null;let s=0;for(let j=i-p+1;j<=i;j++)s+=a[j];return s/p;}
function rsiSeries(c,p=14){const r=Array(c.length).fill(null);if(c.length<=p)return r;let g=0,l=0;
  for(let i=1;i<=p;i++){const d=c[i]-c[i-1];if(d>=0)g+=d;else l-=d;}g/=p;l/=p;r[p]=l===0?100:100-100/(1+g/l);
  for(let i=p+1;i<c.length;i++){const d=c[i]-c[i-1];g=(g*(p-1)+(d>0?d:0))/p;l=(l*(p-1)+(d<0?-d:0))/p;r[i]=l===0?100:100-100/(1+g/l);}return r;}

function analyze(market,name,cd){
  const c=cd.slice().reverse();
  if(c.length<15)return null;
  const close=c.map(x=>x.trade_price), high=c.map(x=>x.high_price),
        low=c.map(x=>x.low_price), vol=c.map(x=>x.candle_acc_trade_volume);
  const n=close.length, i=n-1;
  const rsi=rsiSeries(close,14), rNow=rsi[i], rPrev=rsi[i-1];
  const ma20=sma(close,20,i), chgToday=(close[i]/close[i-1]-1)*100;
  let vAvg=0,cnt=0;

  if(MODE==="bottom"){
    let b=i, mn=Infinity;
    for(let k=i-10;k<=i;k++){if(k>=0&&low[k]<mn){mn=low[k];b=k;}}
    const ds=i-b; if(ds<1||ds>10)return null; if(b-5<0)return null;
    for(let k=Math.max(0,i-LOOKBACK);k<=i;k++){if(low[k]<low[b])return null;}
    let downRef=-Infinity; for(let k=b-5;k<=b-3;k++){if(high[k]>downRef)downRef=high[k];}
    const base=low[b], downMove=downRef-base, upMove=close[i]-base;
    const downPct=downMove/base*100, upPct=upMove/base*100;
    if(!(downPct>=MIN_MOVE_PCT && upMove>=downMove*MIN_RATIO && upMove>0))return null;
    if(rNow!=null && rNow>=75)return null;
    for(let k=b-5;k<=b;k++){if(k-1>=0 && close[k]/close[k-1]-1<=CRASH_DAY)return null;}
    for(let k=Math.max(0,b-6);k<b;k++){vAvg+=vol[k];cnt++;} vAvg/=Math.max(1,cnt);
    let wasOB=false; for(let k=Math.max(0,b-3);k<=b+1&&k<n;k++){if(rsi[k]!=null&&rsi[k]<35){wasOB=true;break;}}
    const badges=[];
    if(wasOB && rNow>rPrev)badges.push(["RSI반등","rsi"]);
    if(vol[i]>vAvg*1.3 || (b+1<n&&vol[b+1]>vAvg*1.3))badges.push(["거래량","vol"]);
    if(ma20!=null&&close[i]>ma20)badges.push(["20일선회복","ma20"]);
    if(chgToday>0)badges.push(["당일상승","sig"]);
    return {market,name,ratio:downMove>0?upMove/downMove:0,defPct:upPct,oppPct:downPct,
      daysSince:ds,price:close[i],chgToday,rsi:rNow,badges};
  } else if(MODE==="top"){
    let p=i, mx=-Infinity;
    for(let k=i-4;k<=i;k++){if(k>=0&&high[k]>mx){mx=high[k];p=k;}}
    const ds=i-p; if(ds<1||ds>4)return null; if(p-5<0)return null;
    for(let k=Math.max(0,i-LOOKBACK);k<=i;k++){if(high[k]>high[p])return null;}
    let upRef=Infinity; for(let k=p-5;k<=p-3;k++){if(low[k]<upRef)upRef=low[k];}
    const base=high[p], upMove=base-upRef, downMove=base-close[i];
    const upPct=upMove/base*100, downPct=downMove/base*100;
    if(!(upPct>=MIN_MOVE_PCT && downMove>=upMove && downMove>0))return null;
    if(rNow!=null && rNow<=25)return null;
    for(let k=p-5;k<=p;k++){if(k-1>=0 && close[k]/close[k-1]-1>=SPIKE_DAY)return null;}
    for(let k=Math.max(0,p-6);k<p;k++){vAvg+=vol[k];cnt++;} vAvg/=Math.max(1,cnt);
    let wasOB=false; for(let k=Math.max(0,p-3);k<=p+1&&k<n;k++){if(rsi[k]!=null&&rsi[k]>65){wasOB=true;break;}}
    const badges=[];
    if(wasOB && rNow<rPrev)badges.push(["RSI하락","rsi"]);
    if(vol[i]>vAvg*1.3 || (p+1<n&&vol[p+1]>vAvg*1.3))badges.push(["거래량","vol"]);
    if(ma20!=null&&close[i]<ma20)badges.push(["20일선이탈","ma20"]);
    if(chgToday<0)badges.push(["당일하락","sig"]);
    return {market,name,ratio:upMove>0?downMove/upMove:0,defPct:downPct,oppPct:upPct,
      daysSince:ds,price:close[i],chgToday,rsi:rNow,badges};
  } else if(MODE==="flat"){
    // 바닥 후 횡보 (바닥 다지기): 현재부터 뒤로 밴드 폭이 유지되는 동안 확장
    let bl=low[i], bh=high[i], days=1;
    for(let k=i-1;k>=Math.max(0,i-20);k--){
      const nl=Math.min(bl,low[k]), nh=Math.max(bh,high[k]);
      if((nh-nl)/nl*100 > FLAT_MAX_RANGE) break;
      bl=nl; bh=nh; days=i-k+1;
    }
    if(days<FLAT_MIN_DAYS) return null;                 // 최소 횡보 일수
    const rangePct=(bh-bl)/bl*100;
    const startIdx=i-days+1;
    const driftPct=Math.abs(close[i]-close[startIdx])/close[startIdx]*100;
    if(driftPct>FLAT_MAX_DRIFT) return null;            // 추세 없이 평평
    let priorHigh=-Infinity;
    for(let k=Math.max(0,startIdx-20);k<startIdx;k++){if(high[k]>priorHigh)priorHigh=high[k];}
    if(priorHigh<=0) return null;
    const dropPct=(priorHigh-bl)/priorHigh*100;
    if(dropPct<FLAT_MIN_DROP) return null;              // 횡보 전에 하락(바닥 찍고)
    let min30=Infinity,max30=-Infinity;
    for(let k=Math.max(0,i-29);k<=i;k++){if(low[k]<min30)min30=low[k];if(high[k]>max30)max30=high[k];}
    const pos=(close[i]-min30)/((max30-min30)||1);
    if(pos>FLAT_MAX_POS) return null;                   // 바닥권(하단부)에서 횡보
    let vRecent=0,cR=0; for(let k=startIdx;k<=i;k++){vRecent+=vol[k];cR++;}
    let vPrior=0,cP=0; for(let k=Math.max(0,startIdx-days);k<startIdx;k++){vPrior+=vol[k];cP++;}
    const volDry = cP>0 && (vRecent/Math.max(1,cR)) < (vPrior/Math.max(1,cP))*0.9;
    const badges=[];
    if(volDry) badges.push(["거래량↓","vol"]);
    if(pos<=0.25) badges.push(["저점권","sig"]);
    if(rNow!=null && rNow>=40 && rNow<=55) badges.push(["RSI중립","rsi"]);
    if(ma20!=null && Math.abs(close[i]-ma20)/close[i]<=0.03) badges.push(["20일선근접","ma20"]);
    return {market,name,ratio:days,defPct:rangePct,oppPct:dropPct,daysSince:days,
      price:close[i],chgToday,rsi:rNow,badges};
  } else {
    // 거래량 급증 (RVOL = 현재 봉 거래량 ÷ 최근 20봉 평균 거래량)
    const val=c.map(x=>x.candle_acc_trade_price);
    let sum=0,cc=0; for(let k=Math.max(0,i-20);k<i;k++){sum+=vol[k];cc++;}
    const avg=sum/Math.max(1,cc);
    if(avg<=0) return null;
    const rvol=vol[i]/avg;
    if(rvol<2) return null;              // 통상 기준: 평균 대비 2배 이상 = 급증
    if(val[i]<1e8) return null;          // 거래대금 1억원 미만(잡음) 제외
    const badges=[];
    badges.push(chgToday>0?["상승봉","sig"]:["하락봉","rsi"]);
    if(rNow!=null && rNow>=70) badges.push(["과열","ma20"]);
    if(ma20!=null && close[i]>ma20) badges.push(["20일선상단","vol"]);
    return {market,name,ratio:rvol,rvol,barVal:val[i],
      daysSince:0,price:close[i],chgToday,rsi:rNow,badges};
  }
}

function fmtKRW(v){
  if(v>=1e12)return (v/1e12).toFixed(2)+"조";
  if(v>=1e8)return (v/1e8).toFixed(0)+"억";
  if(v>=1e4)return (v/1e4).toFixed(0)+"만";
  return String(Math.round(v));
}
function fmtPrice(p){
  if(p>=1000)return p.toLocaleString("ko-KR",{maximumFractionDigits:0});
  if(p>=1)return p.toLocaleString("ko-KR",{maximumFractionDigits:2});
  return p.toLocaleString("ko-KR",{maximumFractionDigits:4});
}
async function fetchJSON(u){const r=await fetch(u);if(!r.ok)throw new Error("HTTP "+r.status);return r.json();}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

async function run(){
  errEl.style.display="none";$("#run").disabled=true;rows=[];
  try{
    statusEl.textContent="마켓 목록 불러오는 중...";
    const all=await fetchJSON(API+"/market/all?is_details=false");
    const krw=all.filter(m=>m.market.startsWith("KRW-"));
    progWrap.style.display="block";
    let done=0;const batch=6;
    for(let s=0;s<krw.length;s+=batch){
      await Promise.all(krw.slice(s,s+batch).map(async m=>{
        try{const cd=await fetchJSON(API+(TF==="4h"?"/candles/minutes/240":"/candles/days")+"?market="+m.market+"&count=120");
          const a=analyze(m.market,m.korean_name,cd);if(a)rows.push(a);}catch(e){}
        done++;
      }));
      progBar.style.width=(done/krw.length*100).toFixed(0)+"%";
      statusEl.textContent=`분석 중... ${done}/${krw.length} 종목`;
      await sleep(120);
    }
    rows.sort((a,b)=>b.ratio-a.ratio);
    progWrap.style.display="none";
    const lbl=MODE==="bottom"?"반등":MODE==="top"?"하락전환":"횡보";
    statusEl.textContent=`완료 · ${lbl} ${rows.length}종목 · ${TF==="4h"?"4시간봉":"일봉"} · ${new Date().toLocaleString("ko-KR")}`;
    render();
  }catch(e){
    progWrap.style.display="none";errEl.style.display="block";
    errEl.innerHTML="데이터를 불러오지 못했습니다: "+e.message+
      "<br>Ctrl+Shift+R로 새로고침하거나, 애드블록을 잠시 꺼보세요.";
    statusEl.textContent="오류 발생";
  }
  $("#run").disabled=false;
}

function passFilter(r){
  if(MODE==="flat"){
    if(filter==="12")return r.daysSince>=10;
    if(filter==="15")return r.defPct<=7;
    return true;
  }
  if(MODE==="vol"){
    if(filter==="12")return r.rvol>=3;
    if(filter==="15")return r.rvol>=5;
    return true;
  }
  if(filter==="12")return r.ratio>=1.2;if(filter==="15")return r.ratio>=1.5;return true;
}

function render(){
  const isTop=MODE==="top", isFlat=MODE==="flat", isVol=MODE==="vol";
  const UNIT=TF==="4h"?"봉":"일";
  const list=rows.filter(passFilter).sort((a,b)=>((a[sortKey]??-1)-(b[sortKey]??-1))*sortDir);
  let lbl,hi,hiLbl,hiCls;
  if(isVol){lbl="거래량 급증 종목";hi=rows.filter(r=>r.rvol>=3).length;hiLbl="3배 이상";hiCls="r-hi";}
  else if(isFlat){lbl="횡보 종목";hi=rows.filter(r=>r.daysSince>=10).length;hiLbl="10일 이상";hiCls="";}
  else if(isTop){lbl="하락전환 종목";hi=rows.filter(r=>r.ratio>=1.5).length;hiLbl="배율 1.5+";hiCls="r-hi-t";}
  else {lbl="반등 종목";hi=rows.filter(r=>r.ratio>=1.5).length;hiLbl="배율 1.5+";hiCls="r-hi";}
  $("#summary").innerHTML=`
    <div class="card"><div class="n">${rows.length}</div><div class="l">${lbl}</div></div>
    <div class="card"><div class="n ${hiCls}">${hi}</div><div class="l">${hiLbl}</div></div>
    <div class="card"><div class="n">${list.length}</div><div class="l">현재 표시</div></div>`;

  const th=(k,label)=>`<th data-k="${k}">${label}${sortKey===k?(sortDir<0?" ▼":" ▲"):""}</th>`;
  let html;
  if(isFlat){
    html=`<table><thead><tr>
      <th style="text-align:left">코인</th>
      ${th("daysSince","횡보"+UNIT+"수")}
      ${th("defPct","횡보폭%")}
      ${th("oppPct","직전낙폭%")}
      ${th("price","현재가")}
      ${th("chgToday","당일%")}
      ${th("rsi","RSI")}
      <th class="hide-sm">보조신호</th>
    </tr></thead><tbody>`;
    for(const r of list){
      const bd=r.badges.map(b=>`<span class="b ${b[1]}">${b[0]}</span>`).join("")||"-";
      html+=`<tr>
        <td class="name"><a href="https://upbit.com/exchange?code=CRIX.UPBIT.${r.market}" target="_blank">${r.name}<span class="tkr">${r.market.replace("KRW-","")}</span></a></td>
        <td class="ratio">${r.daysSince}${UNIT}</td>
        <td>±${r.defPct.toFixed(1)}%</td>
        <td class="down">-${r.oppPct.toFixed(1)}%</td>
        <td>${fmtPrice(r.price)}</td>
        <td class="${r.chgToday>=0?"up":"down"}">${r.chgToday>=0?"+":""}${r.chgToday.toFixed(2)}%</td>
        <td>${r.rsi!=null?r.rsi.toFixed(0):"-"}</td>
        <td class="hide-sm"><div class="badges">${bd}</div></td>
      </tr>`;
    }
  } else if(isVol){
    html=`<table><thead><tr>
      <th style="text-align:left">코인</th>
      ${th("ratio","거래량배율")}
      ${th("chgToday","봉변동%")}
      ${th("barVal","거래대금")}
      ${th("price","현재가")}
      ${th("rsi","RSI")}
      <th class="hide-sm">신호</th>
    </tr></thead><tbody>`;
    for(const r of list){
      const bd=r.badges.map(b=>`<span class="b ${b[1]}">${b[0]}</span>`).join("")||"-";
      html+=`<tr>
        <td class="name"><a href="https://upbit.com/exchange?code=CRIX.UPBIT.${r.market}" target="_blank">${r.name}<span class="tkr">${r.market.replace("KRW-","")}</span></a></td>
        <td class="ratio r-hi">${r.rvol.toFixed(1)}배</td>
        <td class="${r.chgToday>=0?"up":"down"}">${r.chgToday>=0?"+":""}${r.chgToday.toFixed(2)}%</td>
        <td>${fmtKRW(r.barVal)}</td>
        <td>${fmtPrice(r.price)}</td>
        <td>${r.rsi!=null?r.rsi.toFixed(0):"-"}</td>
        <td class="hide-sm"><div class="badges">${bd}</div></td>
      </tr>`;
    }
  } else {
    const ratioLabel=isTop?"하락배율":"회복배율";
    const defLabel=isTop?"낙폭%":"상승폭%";
    const oppLabel=isTop?"직전상승%":"하락폭%";
    const sinceLabel=isTop?"천장경과":"바닥경과";
    html=`<table><thead><tr>
      <th style="text-align:left">코인</th>
      ${th("ratio",ratioLabel)}
      ${th("defPct",defLabel)}
      ${th("oppPct",oppLabel)}
      ${th("daysSince",sinceLabel)}
      ${th("price","현재가")}
      ${th("chgToday","당일%")}
      ${th("rsi","RSI")}
      <th class="hide-sm">보조신호</th>
    </tr></thead><tbody>`;
    for(const r of list){
      const rc=isTop?(r.ratio>=1.5?"r-hi-t":r.ratio>=1.2?"r-mid":""):(r.ratio>=1.5?"r-hi":r.ratio>=1.2?"r-mid":"");
      const defCell=isTop?`<td class="down">-${r.defPct.toFixed(1)}%</td>`:`<td class="up">+${r.defPct.toFixed(1)}%</td>`;
      const oppCell=isTop?`<td class="up">+${r.oppPct.toFixed(1)}%</td>`:`<td class="down">-${r.oppPct.toFixed(1)}%</td>`;
      const bd=r.badges.map(b=>`<span class="b ${b[1]}">${b[0]}</span>`).join("")||"-";
      html+=`<tr>
        <td class="name"><a href="https://upbit.com/exchange?code=CRIX.UPBIT.${r.market}" target="_blank">${r.name}<span class="tkr">${r.market.replace("KRW-","")}</span></a></td>
        <td class="ratio ${rc}">${r.ratio.toFixed(2)}배</td>
        ${defCell}${oppCell}
        <td>${r.daysSince}${UNIT} 전</td>
        <td>${fmtPrice(r.price)}</td>
        <td class="${r.chgToday>=0?"up":"down"}">${r.chgToday>=0?"+":""}${r.chgToday.toFixed(2)}%</td>
        <td>${r.rsi!=null?r.rsi.toFixed(0):"-"}</td>
        <td class="hide-sm"><div class="badges">${bd}</div></td>
      </tr>`;
    }
  }
  html+="</tbody></table>";
  const emptyLbl=isVol?"거래량 급증":isFlat?"횡보":isTop?"하락전환":"반등";
  if(!list.length)html=`<div style='padding:30px;text-align:center;color:var(--muted)'>조건에 맞는 ${emptyLbl} 종목이 없습니다.</div>`;
  $("#tableWrap").innerHTML=html;
  document.querySelectorAll("th[data-k]").forEach(el=>el.onclick=()=>{
    const k=el.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=-1;}render();
  });
}

function setModeUI(){
  const isTop=MODE==="top";
  $("#sub").innerHTML = isTop
    ? `업비트 전 원화(KRW) 종목 일봉을 분석해 <b>천장을 찍고 하락 추세로 돌아선 코인</b>을 찾습니다. 핵심: <b>천장 이후 하락폭 ≥ 천장 직전 3~5일 상승폭</b> (천장은 최근 1~4일 내, 14일 최고). 급등(하루 +15%↑)으로 만든 천장·과매도(RSI 25↓)는 제외.`
    : `업비트 전 원화(KRW) 종목 일봉을 분석해 <b>바닥을 찍고 되돌린 코인</b>을 찾습니다. 핵심: <b>바닥 이후 상승폭이 바닥 직전 3~5일 하락폭 이상</b> (바닥은 최근 1~10일 내, 14일 최저). 급락(하루 -15%↓)으로 만든 바닥·과열(RSI 75↑)은 제외.`;
  $("#legend").innerHTML = isTop
    ? `<div><b>천장 하락전환 판정</b> (모두 충족)</div>
       <div>① <b>천장 형성</b>: 최근 5일 중 최고가가 1~4일 전 + 그 고점이 최근 14일 최고</div>
       <div>② <b>하락 우세</b>: 천장 이후 하락폭 ≥ 천장 직전(3~5일 전 저점→천장) 상승폭 → <b>하락배율 ≥ 1.0</b></div>
       <div>③ <b>상승 실체</b>: 천장 직전 상승폭 3% 이상</div>
       <div>④ <b>급등 제외</b>: 천장 직전에 하루 +15% 이상 급등한 날이 있으면 제외</div>
       <div>⑤ <b>끝물 제외</b>: 현재 RSI 25 이하(이미 과매도)면 제외</div>
       <div style="margin-top:6px"><b>하락배율</b>=천장 후 하락폭 ÷ 천장 전 상승폭. 클수록 되돌림이 강함.</div>
       <div style="margin-top:8px;color:#6b7280">⚠️ 기술적 지표 참고용이며 매도/매수 추천이 아닙니다.</div>`
    : `<div><b>바닥 반등 판정</b> (모두 충족)</div>
       <div>① <b>바닥 형성</b>: 최근 11일 중 최저가가 1~10일 전 + 그 저가가 최근 14일 최저</div>
       <div>② <b>회복 우세</b>: 바닥 이후 상승폭 ≥ 바닥 직전(3~5일 전 고점→바닥) 하락폭 → <b>회복배율 ≥ 1.0</b></div>
       <div>③ <b>하락 실체</b>: 바닥 직전 하락폭 3% 이상</div>
       <div>④ <b>급락 제외</b>: 바닥 직전에 하루 -15% 이상 폭락한 날이 있으면 제외</div>
       <div>⑤ <b>과열 제외</b>: 현재 RSI 75 이상(이미 급등)이면 제외</div>
       <div style="margin-top:6px"><b>회복배율</b>=바닥 후 상승폭 ÷ 바닥 전 하락폭. 클수록 되돌림이 강함.</div>
       <div style="margin-top:8px;color:#6b7280">⚠️ 기술적 지표 참고용이며 매수 추천이 아닙니다.</div>`;
  if(MODE==="flat"){
    $("#sub").innerHTML = `업비트 전 원화(KRW) 종목 일봉을 분석해 <b>바닥을 찍고 좁은 범위에서 횡보(바닥 다지기)하는 코인</b>을 찾습니다. 핵심: <b>최근 6일 이상 좁은 밴드(±9% 이내)</b> 유지 + 그 전에 <b>고점 대비 12%↑ 하락</b>으로 바닥권 진입 + 최근 30일 범위의 하단부에 위치.`;
    $("#legend").innerHTML = `<div><b>바닥 후 횡보 판정</b> (모두 충족)</div>
       <div>① <b>횡보 구간</b>: 최근 밴드 폭 ±9% 이내로 <b>6일 이상</b> 유지 (좁은 박스권)</div>
       <div>② <b>추세 없음</b>: 구간 시작→현재 변동 7% 이내 (오르지도 내리지도 않음)</div>
       <div>③ <b>바닥 찍고</b>: 횡보 직전 고점 대비 밴드가 12% 이상 아래 (하락 후 진입)</div>
       <div>④ <b>바닥권 위치</b>: 최근 30일 범위의 하단 35% 이내 (고점 횡보 제외)</div>
       <div style="margin-top:6px">정렬은 <b>횡보일수</b> 순(오래 다질수록 위). 보조 배지: 거래량↓ · 저점권 · RSI중립 · 20일선근접.</div>
       <div style="margin-top:8px;color:#6b7280">⚠️ 기술적 지표 참고용이며 매수 추천이 아닙니다.</div>`;
  }
  if(MODE==="vol"){
    $("#sub").innerHTML = `업비트 전 원화(KRW) 종목 중 <b>현재 봉 거래량이 최근 20봉 평균보다 급증한 코인</b>을 찾습니다. 기준: <b>상대거래량(RVOL) = 현재 거래량 ÷ 20봉 평균 ≥ 2배</b> (통상 트레이더 기준). 거래대금 1억원 미만은 제외. 4시간봉에서 보면 단기 자금 유입·돌파 포착에 유용합니다.`;
    $("#legend").innerHTML = `<div><b>거래량 급증 판정</b></div>
       <div>① <b>RVOL(상대거래량)</b> = 현재 봉 거래량 ÷ 최근 20봉 평균 거래량</div>
       <div>② RVOL ≥ 2배 = 급증 (통상 기준). 필터로 3배·5배 이상만 볼 수 있음</div>
       <div>③ 해당 봉 거래대금 1억원 미만은 잡음으로 제외</div>
       <div style="margin-top:6px">정렬은 RVOL 순. <b>상승봉</b>=매수세 유입, <b>하락봉</b>=매도세 동반. RSI 70↑이면 '과열' 배지.</div>
       <div style="margin-top:8px;color:#6b7280">⚠️ 기술적 지표 참고용이며 매수 추천이 아닙니다.</div>`;
  }
  const _chips=document.querySelectorAll('.chip');
  if(MODE==="flat"){_chips[1].textContent="횡보 10일+";_chips[2].textContent="좁은폭 ≤7%";}
  else if(MODE==="vol"){_chips[1].textContent="3배+";_chips[2].textContent="5배+";}
  else{_chips[1].textContent="배율 1.2+";_chips[2].textContent="배율 1.5+";}
  if(TF==="4h") $("#sub").innerHTML="⏱ <b>4시간봉</b> 기준 — 아래 설명·표의 '일' 단위는 4시간봉 개수로 보세요.<br>"+$("#sub").innerHTML;
}

document.querySelectorAll(".mode").forEach(el=>el.onclick=()=>{
  document.querySelectorAll(".mode").forEach(x=>x.classList.remove("on"));
  el.classList.add("on");MODE=el.dataset.m;rows=[];sortKey=(MODE==="flat"?"daysSince":"ratio");sortDir=-1;
  $("#summary").innerHTML="";$("#tableWrap").innerHTML="";
  statusEl.textContent="버튼을 눌러 스캔을 시작하세요.";
  setModeUI();
});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
  c.classList.add("on");filter=c.dataset.f;render();
});

// 일봉 / 4시간봉 전환
document.querySelectorAll(".tf").forEach(t=>t.onclick=()=>{
  document.querySelectorAll(".tf").forEach(x=>x.classList.remove("on"));
  t.classList.add("on");TF=t.dataset.tf;rows=[];
  $("#summary").innerHTML="";$("#tableWrap").innerHTML="";
  statusEl.textContent="버튼을 눌러 스캔을 시작하세요.";
  setModeUI();
});
$("#run").onclick=run;
setModeUI();

// ===== 로그인 게이트 =====
const PW="Allupbit1@";
function unlock(){sessionStorage.setItem("auth","1");
  document.getElementById('gate').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');}
function tryLogin(){if(document.getElementById('pw').value===PW)unlock();
  else{document.getElementById('gmsg').textContent="비밀번호가 올바르지 않습니다.";document.getElementById('pw').value="";}}
document.getElementById('gbtn').onclick=tryLogin;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryLogin();});

// 이미 인증된 세션이면 게이트 건너뛰기
if(sessionStorage.getItem("auth")==="1")unlock();
else setTimeout(()=>document.getElementById('pw').focus(),100);
</script>
